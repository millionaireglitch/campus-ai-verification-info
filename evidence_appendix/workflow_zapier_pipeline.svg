<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620">
      <rect width="1000" height="620" rx="12" fill="#090d16"/>
      <!-- Header -->
      <rect x="0" y="0" width="1000" height="50" rx="12" fill="#131b2e"/>
